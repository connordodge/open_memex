name: open_memex_app
description: "Open Memex — local-first AI-native notes."
publish_to: 'none'
version: 0.7.1+9

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  path: ^1.9.0
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.0
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  package_info_plus: ^9.0.1
  cryptography: ^2.9.0
  xml: ^7.1.0
  desktop_drop: ^0.8.4
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Profile-mode long-note benchmark (#133): integration_test/ and
  # test_driver/ only; `flutter test` never runs it.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.3
  cupertino_ui: ^1.1.7

flutter:
  uses-material-design: true
  assets:
    # Bundled fonts and their OFL texts (#373); google_fonts loads these
    # instead of fetching at run time.
    - assets/google_fonts/
