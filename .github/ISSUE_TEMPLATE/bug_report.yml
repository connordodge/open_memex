name: Bug report
description: Something in Open Memex does not work as it should.
labels: ["bug"]
body:
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: For example 14.5 (Apple menu, About This Mac).
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Open Memex version
      description: The vault picker or the About window shows it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
