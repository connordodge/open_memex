# Builds, smoke-tests and publishes the vault server image
# ghcr.io/connordodge/memex (Spec #189).
#
# Pull requests that touch the image's inputs build it natively for
# linux/amd64 and linux/arm64 and run scripts/docker/smoke-test.sh on both.
# They never log in or push, and run with `contents: read` only.
#
# A release publishes after the Release workflow (release.yml) succeeds for a
# v<x.y.z> tag push. release.yml creates the GitHub Release with github.token,
# and events made with that token start no other workflow, so this workflow
# listens for `workflow_run` instead of `release: published`.
#
# Why `workflow_run` is safe here:
# - GitHub runs this file as it is on the default branch, never a version
#   from a pull request or a tag.
# - Release only runs on a `v*` tag push (or a manual dry run, which
#   `event == 'push'` excludes), never on a pull request, so no fork code
#   reaches the jobs that hold `packages: write`.
# - The publish jobs check out the exact commit the Release built
#   (workflow_run.head_sha) and, before anything is pushed, check that tag
#   v<x.y.z> still points at that commit and that <x.y.z> is Cargo.toml's
#   [workspace.package] version.
# - Event values reach run scripts only through `env:`.
#
# Each arch is built on its own runner (no QEMU, no cross-compile), smoke-
# tested, then pushed by digest. The merge job joins both digests into one
# manifest list tagged with the tags scripts/docker/image-tags.sh prints
# (<x.y.z>, and <x.y> / latest when this is the newest of them). If either
# arch fails, nothing is tagged.
name: Docker

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - "deploy/**"
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "scripts/docker/**"
      - .github/workflows/docker.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push to a pull request cancels its older run. Every publish run has
# its own group, so a release is never cancelled or held behind another.
concurrency:
  group: docker-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/connordodge/memex

jobs:
  pr:
    name: PR build + smoke (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the workspace version
        id: version
        run: |
          # The same [workspace.package] parser as scripts/release/check-version.sh.
          version=$(awk '
            { sub(/\r$/, "") }
            /^[ \t]*\[/ { h = $0; gsub(/[ \t]/, "", h); sub(/#.*$/, "", h); t = (h == "[workspace.package]"); next }
            t && /^[ \t]*version[ \t]*=/ { v = $0; sub(/^[^=]*=[ \t]*/, "", v); sub(/[ \t]*#.*$/, "", v); gsub(/["\047]/, "", v); sub(/[ \t]+$/, "", v); print v; exit }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no [workspace.package] version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: memex:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/docker/smoke-test.sh memex:ci "$VERSION"

  release-tag:
    name: Release tag
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Sets `version` only for a v<digits>.<digits>.<digits> tag; any other
      # head_branch leaves it empty, which skips the publish jobs.
      - name: Read the release version from the tag
        id: tag
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$HEAD_BRANCH" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Publishing ${BASH_REMATCH[1]}"
          else
            echo "Not a release tag: '$HEAD_BRANCH'; nothing to publish"
          fi

  publish:
    name: Publish (${{ matrix.platform }})
    needs: release-tag
    if: needs.release-tag.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag and the Cargo version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          VERSION: ${{ needs.release-tag.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if ! tag_sha=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}"); then
            echo "::error::there is no tag $TAG"
            exit 1
          fi
          if [ "$tag_sha" != "$HEAD_SHA" ]; then
            echo "::error::tag $TAG points at $tag_sha, but the Release built $HEAD_SHA"
            exit 1
          fi
          # The same [workspace.package] parser as scripts/release/check-version.sh,
          # so a version the Release accepted is read the same way here.
          cargo_version=$(awk '
            { sub(/\r$/, "") }
            /^[ \t]*\[/ { h = $0; gsub(/[ \t]/, "", h); sub(/#.*$/, "", h); t = (h == "[workspace.package]"); next }
            t && /^[ \t]*version[ \t]*=/ { v = $0; sub(/^[^=]*=[ \t]*/, "", v); sub(/[ \t]*#.*$/, "", v); gsub(/["\047]/, "", v); sub(/[ \t]+$/, "", v); print v; exit }
          ' Cargo.toml)
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml [workspace.package] version is '$cargo_version', not $VERSION"
            exit 1
          fi
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: memex:smoke
          build-args: VERSION=${{ needs.release-tag.outputs.version }}
      - name: Smoke test
        env:
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: scripts/docker/smoke-test.sh memex:smoke "$VERSION"
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build again (every layer is cached), pushed by digest only:
      # the tags are applied once, by the merge job.
      - name: Push the image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.release-tag.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Long enough for "Re-run failed jobs" on a failed merge job to find
          # both digests again.
          retention-days: 7

  merge:
    name: Publish the manifest list
    needs: [release-tag, publish]
    if: needs.release-tag.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the manifest list
        env:
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          image_tags=$(scripts/docker/image-tags.sh "$VERSION")
          tags=()
          for t in $image_tags; do
            tags+=(-t "$IMAGE:$t")
          done
          sources=()
          for f in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$f")")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::expected 2 digests (amd64, arm64), found ${#sources[@]}"
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
