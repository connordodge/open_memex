[workspace]
resolver = "2"
members = [
    "crates/memex-core",
    "crates/memex-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Connor Dodge <12689103+connordodge@users.noreply.github.com>"]
repository = "https://github.com/connordodge/open_memex"

[workspace.dependencies]
rusqlite = { version = "0.39", features = ["bundled", "load_extension", "vtab", "blob"] }
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1.2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
zerocopy = "0.7"
fastembed = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rmcp = { version = "1.5", features = ["server", "transport-io", "macros"] }
schemars = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
