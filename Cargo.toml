[workspace]
resolver = "2"
members = [
    "crates/memex-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Connor Dodge <12689103+connordodge@users.noreply.github.com>"]
repository = "https://github.com/connordodge/open_memex"

[workspace.dependencies]
rusqlite = { version = "0.39", features = ["bundled", "load_extension", "vtab", "blob"] }
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1.2", features = ["serde"] }
tracing = "0.1"
tempfile = "3"
zerocopy = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
