[workspace]
resolver = "2"
members = [
    "crates/memex-core",
    "crates/memex-mcp",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Connor Dodge LLC"]
repository = "https://github.com/connordodge/open_memex"

[workspace.dependencies]
rusqlite = { version = "0.39", features = ["bundled", "load_extension", "vtab", "blob", "backup"] }
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1.2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
zerocopy = "0.7"
fastembed = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "net", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rmcp = { version = "1.5", features = [
    "server",
    "transport-io",
    "macros",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
] }
axum = "0.8"
tower-http = { version = "0.6", features = ["limit"] }
tower = { version = "0.5", features = ["util"] }
subtle = "2.6"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
schemars = "1.2"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
strsim = "0.11.1"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
